<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site_name }} - Enter Access Code</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 480px;
            width: 100%;
            margin: 20px;
            background-color: #1a1a2e;
            border-radius: 16px;
            padding: 40px;
            border: 1px solid #333;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #ff6b35; font-size: 28px; margin-bottom: 8px; }
        .header p { color: #aaa; font-size: 15px; }
        .error-msg {
            background-color: #3a1a1a;
            border: 1px solid #ff4444;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 20px;
            color: #ff6666;
            font-size: 14px;
            text-align: center;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 14px;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background-color: #16213e;
            border: 1px solid #333;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 15px;
            font-family: 'Courier New', monospace;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: #ff6b35; }
        .form-group input::placeholder { color: #555; }
        .btn-submit {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff6b35, #e85d26);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,107,53,0.4); }
        .links {
            text-align: center;
            margin-top: 24px;
        }
        .links a {
            color: #ff6b35;
            text-decoration: none;
            font-size: 14px;
        }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Enter Access Code</h1>
            <p>Paste the code you received by email</p>
        </div>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form action="/paywall/redeem" method="POST">
            <input type="hidden" name="product_id" value="{{ product_id }}">
            <div class="form-group">
                <label for="code">Access Code</label>
                <input type="text" id="code" name="code" placeholder="Paste your access code here..." autocomplete="off" autofocus required>
            </div>
            <button type="submit" class="btn-submit">Activate Access</button>
        </form>

        <div class="links">
            <a href="/paywall/checkout/{{ product_id }}">Don't have a code? Purchase access</a>
        </div>
    </div>
</body>
</html>

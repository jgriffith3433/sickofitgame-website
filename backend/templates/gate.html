<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site_name }} - Paywall</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 520px;
            width: 100%;
            margin: 20px;
            background-color: #1a1a2e;
            border-radius: 16px;
            padding: 40px;
            border: 1px solid #333;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .header { text-align: center; margin-bottom: 28px; }
        .header h1 { color: #ff6b35; font-size: 48px; margin-bottom: 16px; letter-spacing: 2px; text-transform: uppercase; }
        .header p { color: #aaa; font-size: 17px; line-height: 1.6; }
        .price-display {
            text-align: center;
            margin: 24px 0;
            font-size: 56px;
            font-weight: 800;
            color: #00ff88;
        }
        .price-display span { font-size: 20px; color: #666; }
        .options { display: flex; flex-direction: column; gap: 16px; margin-top: 28px; }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-primary {
            background: linear-gradient(135deg, #ff6b35, #e85d26);
            color: #fff;
        }
        .btn-primary:hover { box-shadow: 0 8px 24px rgba(255,107,53,0.4); }
        .btn-secondary {
            background-color: #16213e;
            border: 1px solid #444;
            color: #ccc;
        }
        .btn-secondary:hover { border-color: #ff6b35; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Paywall</h1>
            <p>If you want access, pay for it.</p>
            <p style="margin-top: 8px; color: #666;">(Or don't)</p>
        </div>

        <div class="price-display">${{ "%.2f"|format(product.price_cents / 100) }} <span>USD</span></div>

        <div class="options">
            <a href="/paywall/checkout/{{ product_id }}" class="btn btn-primary">
                Pay
            </a>
            <a href="/paywall/redeem?product={{ product_id }}" class="btn btn-secondary">
                I have a code
            </a>
        </div>
    </div>
</body>
</html>

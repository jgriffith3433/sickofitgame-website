services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # Use the development target so dev differs from prod (live mounts)
      target: development
    container_name: sickofitgame-dev
    ports:
      - "80:80"
    volumes:
      # Mount for live development - update files without rebuilding
      - ./Game:/usr/share/nginx/html/Game
      - ./index.html:/usr/share/nginx/html/index.html
      # Optional: mount nginx.conf for live nginx edits
      # - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - game-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  game-network:
    driver: bridge

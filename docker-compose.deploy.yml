services:
  web:
    image: jgriffith3433/sickofitgame:latest
    container_name: sickofitgame
    ports:
      - "80:80"
    restart: always
    networks:
      - game-network
    environment:
      - TZ=UTC
    labels:
      - "com.docker.compose.project=sickofitgame"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  game-network:
    driver: bridge
